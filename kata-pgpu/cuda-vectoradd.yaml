apiVersion: v1
kind: Pod
metadata:
  name: cuda-vectoradd-kata
  annotations:
    io.katacontainers.config.hypervisor.kernel_params: "nvrc.log=trace"   # 在这里添加你的参数
spec:
  runtimeClassName: kata-qemu-nvidia-gpu
  restartPolicy: OnFailure
  containers:
  - name: cuda-vectoradd
    image: "nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda11.7.1-ubuntu20.04"
    resources:
      limits:
        "nvidia.com/pgpu": 1
